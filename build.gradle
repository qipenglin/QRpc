allprojects {
    group = 'com.qipeng'
    version = '1.0.0-SNAPSHOT'
    
    repositories {
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    
    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-parameters"
    }
    
    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.44'
        annotationProcessor 'org.projectlombok:lombok:1.18.44'
    }
    
    jar {
        manifest {
            attributes 'Implementation-Title': project.name, 'Implementation-Version': project.version
        }
    }
}

project(':qrpc-common') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter:3.5.14'
        implementation 'io.netty:netty-all:4.1.122.Final'
        implementation 'org.slf4j:slf4j-api:2.0.17'
        implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'
        implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
        implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
        
        implementation 'cglib:cglib:3.3.0'
        implementation 'org.apache.zookeeper:zookeeper:3.9.5'
        implementation 'org.apache.curator:curator-framework:5.9.0'
        implementation 'org.apache.curator:curator-recipes:5.9.0'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
        implementation 'com.fasterxml.jackson.core:jackson-core:2.21.2'
        implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21.2'
        implementation 'org.apache.commons:commons-lang3:3.17.0'
        implementation 'commons-io:commons-io:2.19.0'
        implementation 'org.apache.commons:commons-collections4:4.5.0'
        implementation 'com.caucho:hessian:4.0.66'
        implementation 'com.alibaba.fastjson2:fastjson2:2.0.62'
        implementation 'io.protostuff:protostuff-core:1.8.0'
        implementation 'io.protostuff:protostuff-runtime:1.8.0'
        implementation 'redis.clients:jedis:5.2.1'
        implementation 'net.openhft:affinity:3.23.3'
    }
}

project(':qrpc-client') {
    dependencies {
        implementation project(':qrpc-common')
    }
}

project(':qrpc-server') {
    dependencies {
        implementation project(':qrpc-common')
    }
}

project(':qrpc-test-api') {
}

project(':qrpc-test-server') {
    dependencies {
        implementation project(':qrpc-server')
        implementation project(':qrpc-test-api')
        implementation 'org.springframework.boot:spring-boot-starter:3.5.14'
        implementation 'org.springframework.boot:spring-boot-starter-web:3.5.14'
        implementation 'org.springframework.boot:spring-boot-starter-log4j2:3.5.14'
        implementation 'org.apache.commons:commons-lang3:3.17.0'
    }
}

project(':qrpc-test-client') {
    dependencies {
        implementation project(':qrpc-client')
        implementation project(':qrpc-test-api')
        implementation 'org.springframework.boot:spring-boot-starter:3.5.14'
        implementation 'org.springframework.boot:spring-boot-starter-web:3.5.14'
        implementation 'org.springframework.boot:spring-boot-starter-log4j2:3.5.14'
        implementation 'org.apache.commons:commons-lang3:3.17.0'
    }
}

project(':qrpc-all') {
    dependencies {
        runtimeOnly project(':qrpc-client')
        runtimeOnly project(':qrpc-server')
        runtimeOnly project(':qrpc-common')
    }
}
